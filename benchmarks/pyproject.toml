[project]
name = "anyspark-benchmarks"
version = "0.1.0"
description = "AnySpark v4 benchmark（半独立子项目：单元层/系统层/对比层/人工层）"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.*",
    "httpx2==2.9.*",  # S66：下一代 HTTP 客户端（脚本 import httpx2 as httpx）
    "pyyaml==6.0.*",
]

[tool.hatch.build.targets.wheel]
packages = ["benchmarks"]

[tool.ruff]
line-length = 100
