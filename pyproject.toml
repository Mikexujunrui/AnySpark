# ---------------------------------------------------------------------------
# AnySpark v4 — uv workspace 根
# 纪律：依赖 pin `==` + 锁文件（uv.lock）；新增包成员需在此声明
# marker: S0
# ---------------------------------------------------------------------------
[project]
name = "anyspark"
version = "0.0.1"
description = "AnySpark v4 创作引擎（workspace 根项目）"
requires-python = ">=3.11"
dependencies = [
    "anyspark-core",  # 工作区成员（editable），版本由成员包自身约束
]

[tool.uv.workspace]
members = [
    "packages/*",
]

[tool.uv.sources]
anyspark-core = { workspace = true }


# 门禁工具版本（pin）
[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest==7.4.3",
    "ruff==0.16.1",
    "mypy==1.11.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [
    "packages/core",
    "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "ASYNC"]
ignore = [
    # 本项目以中文承载内容，Unicode 混淆检测会误报中文，关闭
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-docstring
    "RUF003",  # ambiguous-unicode-comment
]

[tool.ruff.lint.per-file-ignores]
"packages/core/src/anyspark/__init__.py" = ["F401"]  # 纯 API 再导出 shim

[tool.ruff.lint.isort]
known-first-party = ["anyspark"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
files = [
    "packages/core",
]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests"]
addopts = "-q"
