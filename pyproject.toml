[project]
name = "novel-agent"
version = "3.2.7"
description = "AI 小说写作辅助 Agent — AnySpark（火花）"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
    { name = "Junrui Xu", email = "mikexujunrui@mail.ustc.edu.cn" },
]
dependencies = [
    "openai==2.37.0",
    "python-dotenv==1.2.2",
    "fastapi==0.135.1",
    "uvicorn[standard]==0.41.0",
    "sse-starlette==3.4.4",
    "python-multipart==0.0.32",
    "python-docx==1.2.0",  # docx 导出
    "rich==14.3.3",  # CLI 美化输出
    "pydantic==2.13.4",
    "pyyaml==6.0.2",
    "tiktoken==0.12.0",
    "pygit2==1.19.3",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.0",
    "pytest-asyncio==1.4.0",
]

[project.scripts]
novel-cli = "main:main"

[project.urls]
Homepage = "https://github.com/Mikexujunrui/AnySpark"
Repository = "https://github.com/Mikexujunrui/AnySpark"
Issues = "https://github.com/Mikexujunrui/AnySpark/issues"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B904",  # exception chaining (style preference, not a bug)
    "B023",  # loop variable binding in closures (common async pattern)
    "B007",  # unused loop variable (pervasive false positives)
    "B008",  # function call in argument defaults (false positive for FastAPI)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# The src/ layout maps top-level `core`/`data` imports onto src/core and
# src/data. Declaring mypy_path lets mypy resolve those imports the same way
# a `pip install -e .` does in CI (without relying on the editable finder).
mypy_path = ["src"]
explicit_package_bases = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
