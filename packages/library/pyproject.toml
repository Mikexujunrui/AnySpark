# ---------------------------------------------------------------------------
# anyspark-library — 参考书库扩展包（S86）
# 全局书库（data/library/ 文件区）+ 项目选参考书 + 只读检索（不注入）。
# 哲学：参考书=只读检索源（要借鉴时才翻书，不借鉴时完全不干扰写作）。
# marker: S86
# ---------------------------------------------------------------------------
[project]
name = "anyspark-library"
version = "0.0.1"
description = "AnySpark v4 参考书库：全局书库 + 项目选参考书 + 只读检索（不注入）"
requires-python = ">=3.11"
dependencies = [
    "anyspark-core==0.0.1",  # workspace 成员
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anyspark"]
