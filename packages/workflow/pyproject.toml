# ---------------------------------------------------------------------------
# anyspark-workflow — 工作流扩展包（可选增强，默认关闭）
# 结构化流程三结构：顺序 + 分支(gate) + 循环(loop) + 断点恢复 + 每节点记账。
# 设计规格：DESIGN.md §12.22（S59）。依赖：core（单向）。
# 哲学：机制硬编码（引擎/条件解析/状态机/恢复）、内容自然语言（节点指令/条件）。
# marker: S59
# ---------------------------------------------------------------------------
[project]
name = "anyspark-workflow"
version = "0.0.1"
description = "AnySpark v4 工作流：结构化流程（顺序/分支/循环）+ 断点恢复 + AI 生成"
requires-python = ">=3.11"
dependencies = [
    "anyspark-core==0.0.1",  # workspace 成员
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anyspark"]

[tool.uv.sources]
anyspark-core = { workspace = true }
