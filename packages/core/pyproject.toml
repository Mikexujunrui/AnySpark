#
# AnySpark v4 — core 包（anyspark-core）
# 内核包：Agent 循环 / 工具调用协议 / 事件协议 / 存储接口
# 铁律：core 不依赖任何其他包（单向依赖、无循环）、模型无关、机制硬编码内容自然语言
# marker: S0
#
[project]
name = "anyspark-core"
version = "0.0.1"
description = "AnySpark v4 内核包：Agent 循环、工具协议、事件协议、存储接口"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anyspark"]
