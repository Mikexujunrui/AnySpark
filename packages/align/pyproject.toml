# ---------------------------------------------------------------------------
# anyspark-align — 对齐系统包（说明书/提炼器/摘要器/信号采集/注入器）
# 依赖：core（单向）。设计规格：DESIGN.md 第 6 节（T3）
# marker: S2
# ---------------------------------------------------------------------------
[project]
name = "anyspark-align"
version = "0.0.1"
description = "AnySpark v4 对齐系统：说明书分层 / 提炼器 / 摘要器 / 信号采集 / 注入器"
requires-python = ">=3.11"
dependencies = [
    "anyspark-core==0.0.1",  # workspace 成员
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anyspark"]

[tool.uv.sources]
anyspark-core = { workspace = true }
