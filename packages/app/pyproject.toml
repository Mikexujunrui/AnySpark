# ---------------------------------------------------------------------------
# anyspark-app — 应用层：真实模型适配器（DeepSeek）+ FastAPI 后端 API
# 依赖：core（内核），不反向依赖；承载所有"真实运行"装配（真实 LLM/HTTP/存储落盘）
# marker: S1
# ---------------------------------------------------------------------------
[project]
name = "anyspark-app"
version = "0.0.1"
description = "AnySpark v4 应用层：DeepSeek 真实接入 + FastAPI 后端"
requires-python = ">=3.11"
dependencies = [
    "anyspark-core==0.0.1",  # workspace 成员
    "anyspark-graph==0.0.1",  # workspace 成员：知识图谱（AI 事实源）
    "anyspark-align==0.0.1",  # workspace 成员：说明书/信号/提炼/心智
    "anyspark-check==0.0.1",  # workspace 成员：检测网+规则
    "anyspark-explore==0.0.1",  # workspace 成员：探索引擎
    "anyspark-template==0.0.1",  # workspace 成员：模式库/资料/伏笔
    "anyspark-workflow==0.0.1",  # workspace 成员：工作流扩展包
    "anyspark-play==0.0.1",  # workspace 成员：互动推演扩展包
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "pydantic==2.13.4",
    "openai==2.52.0",
    "python-dotenv==1.1.1",
    "tiktoken==0.9.0",
]

[project.scripts]
anyspark-server = "anyspark.server.cli:main"
anyspark-chat = "anyspark.server.cli_chat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anyspark"]

[tool.uv.sources]
anyspark-core = { workspace = true }
anyspark-graph = { workspace = true }
